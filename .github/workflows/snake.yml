name: Generate contribution snake

on:
  schedule:
    # 每天 UTC 00:00（台北時間早上 8 點）跑一次
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# 第三方 Action 鎖定 commit SHA（tag 可以被改指向別的程式碼），這個 job 有 contents: write。
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
